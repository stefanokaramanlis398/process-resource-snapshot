[project]
name = "process-resource-snapshot"
version = "0.1.2"
description = "A context manager that captures CPU time, memory blocks, and open fd counts before and after a block, computing the delta for resource attribution."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
